server {
    listen 80;
    server_name _;

    # Отключаем запись IP-адресов посетителей в логи доступа
    access_log off;
    error_log /dev/stderr crit;

    # Лимит на размер тела запроса
    client_max_body_size 10M;

    # Включаем сжатие Gzip для быстрой загрузки на смартфонах
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 1. Раздача статики фронтенда (style.css, app.js) напрямую через Nginx
    location /static/ {
        alias /usr/share/nginx/html/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Раздача фотографий (hero.jpg и галереи работ) напрямую через Nginx
    location /images/ {
        alias /usr/share/nginx/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

     # 2.5 Раздача самостоятельно размещённых шрифтов (без обращения к Google Fonts)
    location /fonts/ {
        alias /usr/share/nginx/fonts/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Проксирование API-запросов и документации Swagger в FastAPI (без передачи IP клиента)
    location ~ ^/(api|docs|redoc|openapi.json) {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. SPA-маршрутизация: все остальные пути отдают index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}